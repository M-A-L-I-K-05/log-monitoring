services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: factory
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "factory"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  equipment:
    build: ./services/equipment
    container_name: equipment
    ports:
      - "8001:8001"
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://admin:secret@postgres:5432/factory
    volumes:
      - ./services/equipment:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      logging: "promtail"
    restart: unless-stopped

  production:
    build: ./services/production
    container_name: production
    ports:
      - "8002:8002"
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://admin:secret@postgres:5432/factory
    volumes:
      - ./services/production:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      logging: "promtail"
    restart: unless-stopped

  quality:
    build: ./services/quality
    container_name: quality
    ports:
      - "8003:8003"
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://admin:secret@postgres:5432/factory
    volumes:
      - ./services/quality:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      logging: "promtail"
    restart: unless-stopped

  maintenance:
    build: ./services/maintenance
    container_name: maintenance
    ports:
      - "8004:8004"
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://admin:secret@postgres:5432/factory
    volumes:
      - ./services/maintenance:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8004", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      logging: "promtail"
    restart: unless-stopped

  simulator:
    build: ./simulator
    container_name: simulator
    ports:
      - "8005:8005"
    environment:
      PYTHONUNBUFFERED: 1
      EQUIPMENT_URL: http://equipment:8001
      PRODUCTION_URL: http://production:8002
      QUALITY_URL: http://quality:8003
      MAINTENANCE_URL: http://maintenance:8004
    volumes:
      - ./simulator:/app
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8005", "--reload"]
    depends_on:
      - equipment
      - production
      - quality
      - maintenance
    labels:
      logging: "promtail"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    user: "0"
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - postgres
      - loki

volumes:
  postgres-data:
  loki-data:
  grafana-data: