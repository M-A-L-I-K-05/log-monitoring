apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    url: http://loki:3100
    basicAuth: false
    isDefault: true
    version: 1
    editable: true
  - name: PostgreSQL  
    type: postgres  
    url: postgres:5432  
    database: factory  
    user: admin  
    secureJsonData:  
      password: secret  
    jsonData:  
      sslmode: disable  
    isDefault: false  
    editable: true  
